name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sensitive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal or security details
        run: python3 scripts/check-sensitive.py --all

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent tests
        working-directory: agent
        run: python3 -m unittest discover -s tests -t .

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        working-directory: mac
        run: swift test --scratch-path "$RUNNER_TEMP/tuxpane-swift-build"
